<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Klinik Gadget Bandung logo">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background (transparent) -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Icon: rounded smartphone with plus symbol -->
  <g transform="translate(24,24)">
    <rect x="0" y="0" width="120" height="152" rx="18" ry="18" fill="url(#g1)" />
    <rect x="10" y="12" width="100" height="116" rx="10" fill="#ffffff" opacity="0.95"/>
    <!-- speaker -->
    <rect x="40" y="6" width="40" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
    <!-- home button -->
    <circle cx="60" cy="136" r="6" fill="#ffffff" opacity="0.6"/>

    <!-- plus sign inside screen to suggest service/repair -->
    <g transform="translate(60,74)">
      <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#06b6d4" />
      <rect x="-3" y="-12" width="6" height="24" rx="2" fill="#06b6d4" />
    </g>
  </g>

  <!-- Text -->
  <g transform="translate(170,62)">
    <text x="0" y="0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">KLINIK GADGET</text>
    <text x="0" y="40" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f172a">BANDUNG</text>
  </g>

  <!-- Tagline -->
  <text x="170" y="120" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#334155">Service • Repair • Sparepart • Garansi</text>
</svg>